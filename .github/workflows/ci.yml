name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    name: 前端 jest（含忠实度金标）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 忠实度金标（改闸门必看）
        run: npx jest --ci tests/fidelityGold.test.ts --runInBand
      - name: 全量测试
        run: npx jest --ci --runInBand

  backend-smoke:
    name: 后端导入烟测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 导入烟测（防止依赖/语法损坏）
        run: python -c "import app.main; print('backend import ok')"
