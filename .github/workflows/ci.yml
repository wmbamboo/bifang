name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    name: 前端 jest（含忠实度金标）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # frontend/ 是仓库子目录：husky install 找不到 .git；file: 自引用还会让
      # --ignore-scripts 仍跑 prepare。装依赖前去掉 lifecycle，金标不需要 max/husky。
      - name: Install deps
        run: |
          npm pkg delete scripts.prepare scripts.postinstall
          npm ci
      - name: 忠实度金标 + 元话语/栏轴闸（改闸门必看）
        run: npx jest --ci --runInBand --testPathPattern='(fidelityGold|outlineMetaCoverage|priceBandTokenFidelity)'
      - name: 全量测试（已忽略未迁移遗留用例）
        run: npx jest --ci --runInBand

  backend-smoke:
    name: 后端导入烟测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 导入烟测（防止依赖/语法损坏）
        run: python -c "import app.main; print('backend import ok')"
      - name: 抽取层金标（改 table_structure/extract 必看）
        run: |
          pip install pytest -q
          PYTHONPATH=. python -m pytest tests/ -v --tb=short
